{{ define "main" }}
<section id="experience" class="section bg-navy" style="padding-top: 8rem;">
  <div class="container" style="max-width: 64rem;">
    <div class="fade-in">
      <h2 class="section-header text-white mb-12">
        <span class="section-bar section-bar-wide"></span>
        {{ .Title }}
      </h2>

      <div class="relative">
        <div class="timeline-line" style="display: none;" id="timeline-line"></div>

        <div style="display: flex; flex-direction: column; gap: 2.5rem;">
          {{ range $idx, $exp := .Site.Data.experience }}
          <div class="fade-in delay-{{ add $idx 1 }}">
            <div class="flex gap-6" style="gap: 1.5rem;">
              <div class="shrink-0" style="width: 60px; display: flex; flex-direction: column; align-items: center; padding-top: 0.5rem;">
                <div class="timeline-dot"></div>
              </div>

              <div class="flex-1" style="min-width: 0; padding-bottom: 0.5rem;">
                <div class="mb-3">
                  <h3 class="text-lg font-bold text-white">{{ $exp.company }}</h3>
                  <p class="text-sm font-medium text-white-70" style="margin-top: 0.125rem;">{{ $exp.title }}</p>
                  <p class="text-xs text-white-50" style="margin-top: 0.25rem;">{{ $exp.period }}</p>
                </div>

                <div class="card p-5">
                  {{ with $exp.context }}
                  <p class="context-quote">{{ . }}</p>
                  {{ end }}

                  <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.5rem;">
                    {{ range $exp.bullets }}
                    <li class="flex items-start gap-3">
                      <svg class="icon-sm shrink-0" style="margin-top: 0.125rem; color: hsl(var(--primary) / 0.6);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                      <span class="text-sm text-muted leading-relaxed">{{ . }}</span>
                    </li>
                    {{ end }}
                  </ul>
                </div>
              </div>
            </div>
          </div>
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
